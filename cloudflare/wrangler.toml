name = "aestrl-signaling"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
HUB_ORIGIN = "https://aestrl.dvrsfy.org"

[durable_objects]
bindings = [
  { name = "SIGNALING_DO", class_name = "SignalingDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["SignalingDO"]

[assets]
directory = "../web"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
